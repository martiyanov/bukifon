name: Validate modules

on:
  push:
    paths: ['modules/**', 'tools/validate_module.py', '.github/workflows/modules.yml']
  pull_request:
    paths: ['modules/**', 'tools/validate_module.py']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate module.json
        run: python3 tools/validate_module.py modules
      - name: Compile C++ examples against ABI v0
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq g++ >/dev/null
          for f in $(find modules -name '*.cpp' -path '*/src/*'); do
            echo "compile $f"; g++ -std=c++17 -Wall -Wextra -I firmware/include -c "$f" -o /tmp/$(basename "$f").o
          done
