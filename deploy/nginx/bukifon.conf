# Bukifon — static site (RU/EN) + demo. Деплой: bash tools/deploy_vds.sh --nginx
# TLS: certbot --nginx для bukifon.com (sslip — временный); .ru — после делегации DNS.

server { listen 80; listen [::]:80; server_name bukifon.37-46-18-40.sslip.io; return 301 https://$host$request_uri; }
server {
    listen 443 ssl; listen [::]:443 ssl;
    server_name bukifon.37-46-18-40.sslip.io;
    root /var/www/bukifon; index index.html;
    ssl_certificate /etc/letsencrypt/live/bukifon.37-46-18-40.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bukifon.37-46-18-40.sslip.io/privkey.pem;
    include /etc/nginx/snippets/bukifon-site.inc;
}

# bukifon.com — основной (TLS есть)
server {
    listen 80; listen [::]:80;
    server_name bukifon.com;
    return 301 https://bukifon.com$request_uri;
}
server {
    listen 443 ssl; listen [::]:443 ssl;
    server_name bukifon.com;
    root /var/www/bukifon; index index.html;
    ssl_certificate /etc/letsencrypt/live/bukifon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bukifon.com/privkey.pem;
    include /etc/nginx/snippets/bukifon-site.inc;
}
server {
    listen 80; listen [::]:80;
    server_name www.bukifon.com;
    return 301 https://bukifon.com$request_uri;
}
server {
    listen 443 ssl; listen [::]:443 ssl;
    server_name www.bukifon.com;
    ssl_certificate /etc/letsencrypt/live/bukifon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bukifon.com/privkey.pem;
    return 301 https://bukifon.com$request_uri;
}

# bukifon.ru — после делегации NS; TLS выпустит certbot/watcher
server {
    listen 80; listen [::]:80;
    server_name bukifon.ru www.bukifon.ru;
    root /var/www/bukifon; index index.html;
    include /etc/nginx/snippets/bukifon-site.inc;
}
