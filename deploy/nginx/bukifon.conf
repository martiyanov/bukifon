# Bukifon — static site (RU/EN) + demo. Deploy: bash tools/deploy_vds.sh
server {
    listen 80;
    listen [::]:80;
    server_name bukifon.ru www.bukifon.ru bukifon.com www.bukifon.com bukifon.37-46-18-40.sslip.io;

    root /var/www/bukifon;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Web app (PWA) — пока демо; см. docs/86
    location = /app/ { return 302 /demo/; }
    location /app/ { return 302 /demo/; }

    location / { try_files $uri $uri/ =404; }

    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
