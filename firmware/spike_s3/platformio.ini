; S3 vertical-slice spike — standalone PlatformIO project (lite concept platform).
;
;   pio run -d firmware/spike_s3 -e spike_s3            # build (S3-N16R8)
;   pio run -d firmware/spike_s3 -e spike_s3 -t upload  # flash devkit
;   pio device monitor -b 115200
;
; Customer decision (round 6): the first SKU is P4 with RGB565/DSI + HS USB;
; S3 is the "lite later" platform.  This spike validates the same codecs, SD,
; USB composite and panel scan on cheap devkit hardware; the SPI display path is
; S3-only (P4 uses RGB565/DSI).  See docs/39-s3-spike-protocol.md.
;
; P4 spike: prepared but not buildable here — official espressif32 8.0.0 has no
; ESP32-P4 board/framework.  On a P4-capable platform (pioarduino/arduino-esp32
; P4 preview) use the same spike_main.cpp with the RGB565/DSI display backend
; and HS USB (see docs/39 §"P4").
;
; [env:spike_p4]
; platform = <p4-capable platform>
; board = <P4 devkit board>
; framework = arduino
; build_flags =
;     -std=gnu++17
;     -O2
;     -DBUKIFON_SPIKE
;     -DBUKIFON_ESP32_P4
;     -I.
; build_src_filter = +<spike_main.cpp>

[platformio]
default_envs = spike_s3
src_dir = .

[env:spike_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -O2
    -DBUKIFON_SPIKE
    -DBUKIFON_ESP32_S3
    -DBUKIFON_SPIKE_AUDIO_SECONDS=60
    -DBUKIFON_SPIKE_DISPLAY_SECONDS=60
    -DBUKIFON_SPIKE_USB_SECONDS=60
    -I.
build_src_filter = +<spike_main.cpp>
