; Bukifon firmware — PlatformIO project
;
; Build:  pio run -d firmware/Bukifon
; Flash:  pio run -d firmware/Bukifon -t upload
;
; The project compiles the sketch plus every portable engine/module source via
; engine_unity.cpp (src_dir = . so the .ino stays in the project root).

[platformio]
src_dir = .
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1m
board_build.flash_mode = qio
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DBUKIFON_EMBEDDED
    -I../src

; Библиотеки (TinyUSB, LittleFS, NeoPixel) входят в core arduino-pico.

; Keep the host tests and tools out of the firmware build.
build_unflags = -std=gnu++11
