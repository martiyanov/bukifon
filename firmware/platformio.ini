; Bukifon v0.5 firmware — platform project for ESP32-P4 / ESP32-S3 + host.
;
; This is a *separate* project from the RP2040 prototype in
; firmware/Bukifon/ (that one stays untouched and keeps building with the
; community raspberrypi/arduino-pico platform).
;
;   pio run -d firmware -e native      # host build of the demo/screenshot tool
;   pio run -d firmware -e s3          # ESP32-S3 skeleton build
;   pio run -d firmware -e p4          # ESP32-P4 (see note below)
;
; Use PLATFORMIO_CORE_DIR in sandboxes where ~/.platformio is not writable:
;   PLATFORMIO_CORE_DIR=/tmp/piocore pio run -d firmware -e s3
;
; ESP32-P4 status (checked 2026-11): the official PlatformIO espressif32
; platform 8.0.0 ships arduino-esp32 3.x with S3/C3/C6 targets but has no
; ESP32-P4 board definitions and no P4 framework package, so env:p4 cannot be
; built here.  The P4 switch is prepared as a commented environment below; on
; a machine with a P4-capable platform (pioarduino/arduino-esp32 3.1+ P4
; preview) set `platform`/`board` and the same sources build unchanged.

[platformio]
src_dir = .
default_envs = native

; ---------------------------------------------------------------------------
; Host: deterministic simulator + 800x480 screenshot renderer.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=c++17
    -O2
    -Isrc
    -Iinclude
    -Iapp
build_src_filter =
    +<app/sim_main.cpp>
    +<engine_unity.cpp>
    +<sim_unity.cpp>
    +<modules/examples/>

; ---------------------------------------------------------------------------
; ESP32-S3: firmware skeleton (UI shell, engine, USB/BLE/Wi-Fi frameworks).
; ---------------------------------------------------------------------------
[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
build_flags =
    -std=gnu++17
    -O2
    -DBUKIFON_ESP32
    -DBUKIFON_ESP32_S3
    -DBUKIFON_EMBEDDED
    -Isrc
    -Iinclude
    -Iapp
build_src_filter =
    +<app/esp32_main.cpp>
    +<engine_unity.cpp>
    +<modules/examples/>

; ---------------------------------------------------------------------------
; ESP32-P4: ready to switch when the platform supports it.
; Uncomment and set your P4 platform/board, then `pio run -d firmware -e p4`.
; ---------------------------------------------------------------------------
; [env:p4]
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
; board = esp32-p4-function-ev
; framework = arduino
; monitor_speed = 115200
; board_build.flash_mode = qio
; build_flags =
;     -std=gnu++17
;     -O2
;     -DBUKIFON_ESP32
;     -DBUKIFON_ESP32_P4
;     -DBUKIFON_EMBEDDED
;     -DBUKIFON_PSRAM
;     -Isrc
;     -Iinclude
;     -Iapp
; build_src_filter =
;     +<app/esp32_main.cpp>
;     +<engine_unity.cpp>
;     +<modules/examples/>

; ---------------------------------------------------------------------------
; P1 benchmark environments (firmware/bench).  Host target is the Makefile:
;   make -C firmware/bench host
; The device envs build bench/device_main.cpp + the same portable scenarios.
; ---------------------------------------------------------------------------
[env:bench]
platform = native
build_flags =
    -std=c++17
    -O2
    -Isrc
    -Iinclude
    -Ibench/lib
build_src_filter =
    +<bench/bench_main.cpp>
    +<bench/lib/>
    +<engine_unity.cpp>

[env:bench_s3]
extends = env:s3
build_flags =
    ${env:s3.build_flags}
    -DBUKIFON_BENCH_DEVICE
    -Ibench/lib
build_src_filter =
    +<bench/device_main.cpp>
    +<bench/lib/>
    +<engine_unity.cpp>
    +<modules/examples/>

; P4 benchmark: prepared, but official espressif32 8.0.0 has no P4 target.
; [env:bench_p4]
; extends = env:bench_s3
; build_flags = ${env:bench_s3.build_flags} -DBUKIFON_ESP32_P4
; (use the P4 platform/board from the commented env:p4 block above)

; STM32H743 (Nucleo-H743ZI2): prepared, needs the ststm32 platform installed.
; [env:bench_h743]
; platform = ststm32
; board = nucleo_h743zi
; framework = arduino
; build_flags =
;     -std=gnu++17
;     -O2
;     -DBUKIFON_BENCH_DEVICE
;     -DBUKIFON_H743
;     -Ibench/lib
;     -Isrc
;     -Iinclude
;     -Ibench/lib
; build_src_filter =
;     +<bench/device_main.cpp>
;     +<bench/lib/>
;     +<engine_unity.cpp>
;     +<modules/examples/>

; ---------------------------------------------------------------------------
; S3-base profile (CORE-S3 rev.0, ESP32-S3-WROOM-1-N16R8: 16 MB flash,
; 8 MB octal PSRAM @80 MHz).  Pin map: hardware/cores3/pinmap.csv via
; src/hal/board_cores3.*.  Display: SPI2 800x480 (D-51), USB FS stereo UAC2
; (D-48, 8x8 only P4/H743).  Board data paths are TODO(hw) stubs.
; ---------------------------------------------------------------------------
[env:s3base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -O2
    -DBUKIFON_ESP32
    -DBUKIFON_ESP32_S3
    -DBUKIFON_S3BASE
    -DBUKIFON_EMBEDDED
    -DBUKIFON_PSRAM_OCTAL
    -Isrc
    -Iinclude
    -Iapp
build_src_filter =
    +<app/s3base_main.cpp>
    +<engine_unity.cpp>
    +<modules/examples/>
    +<src/hal/board_cores3.cpp>
